<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="background">
  <img src="fundo (1).jpg" id="bg-img">
</div>


</div>

<!--search bar-->
<div class="container">
  <div class="search-container">
  <div class="search-bar">
    <i class="icon"></i>
    <input type="text" id="search" placeholder="Search"/>
  </div>
</div>



<div class="player">
  <div class="cover" id="cover">
    <img src="2466046_12382.png" alt="Capa do álbum">
    <img src="disks/cdplaceholder.png" alt="CD" id="cd-hover" class="cd-hover">
  </div>

  <div class="display" id="display">Nenhuma música</div>

  <div class="progress-container" id="progress-container">
    <div class="progress" id="progress"></div>
  </div>

  <div class="time">
    <span id="current-time">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="pause">⏸</button>
    <button id="next">⏭</button>
  </div>

  <div class="playlist" id="playlist"></div>

  <audio id="audio"></audio>



  
</div>

  <!-- Modal do CD -->
<div id="cd-modal" class="cd-modal">
  <div class="cd-content">
    <span class="close">&times;</span>
    <div class="cd-disk">
      <img id="cd-image" src="" alt="CD Cover">
    </div>
    <div class="cd-info">
      <h3 id="cd-title"></h3>
      <h4 id="cd-album"></h4>
      <p id="cd-artist"></p>
    </div>
  </div>
</div>




</div>

<script src="script.js"></script>

</body>
</html>
