<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background">
    <img src="background/fundo (1).jpg" id="bg-img" alt="Plano de fundo do player">
  </div>

  <main class="container">
    <div class="search-container">
      <div class="search-shell">
        <div class="search-modes" aria-label="Fonte da busca">
          <button type="button" class="search-mode active" id="local-mode-btn" aria-pressed="true">Biblioteca</button>
          <button type="button" class="search-mode spotify-mode" id="spotify-mode-btn" aria-pressed="false">
            <img src="spotify-round-black-icon.svg" alt="" aria-hidden="true">
            Spotify
          </button>
        </div>

        <div class="search-bar">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input type="text" id="search" autocomplete="off" placeholder="Buscar na sua biblioteca">
          <span id="search-status" class="search-status"></span>
        </div>

      </div>
    </div>

    <div class="player">
      <div class="cover" id="cover">
        <img src="background/2466046_12382.png" alt="Capa do álbum">
        <img src="disks/cdplaceholder.png" alt="CD" id="cd-hover" class="cd-hover">
      </div>

      <div class="now-playing-heading">
        <span class="player-source" id="player-source">Biblioteca</span>
        <span class="playback-message" id="playback-message" role="status" aria-live="polite"></span>
      </div>

      <div class="display" id="display">Nenhuma música</div>

      <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
      </div>

      <div class="time">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="prev" aria-label="Música anterior">⏮</button>
        <button id="play-toggle" class="play-toggle" aria-label="Reproduzir" aria-pressed="false">▶</button>
        <button id="next" aria-label="Próxima música">⏭</button>
      </div>

      <div class="volume-control">
        <button type="button" id="mute-toggle" class="volume-button" aria-label="Silenciar">🔊</button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        <span id="volume-value" aria-hidden="true">80%</span>
      </div>

      <section id="spotify-search-area" class="spotify-search-area" aria-live="polite" hidden>
        <div id="spotify-account" class="spotify-account" hidden></div>
        <div id="spotify-results"></div>
      </section>

      <div class="playlist" id="playlist"></div>
      <audio id="audio"></audio>
    </div>

    <div id="cd-modal" class="cd-modal">
      <div class="cd-content">
        <span class="close">&times;</span>
        <div class="cd-disk">
          <img id="cd-image" src="" alt="CD Cover">
        </div>
        <div class="cd-info">
          <h3 id="cd-title"></h3>
          <h4 id="cd-album"></h4>
          <p id="cd-artist"></p>
        </div>
      </div>
    </div>
  </main>

  <script src="library.js"></script>
  <script src="script.js"></script>
  <script src="spotify.js"></script>
</body>
</html>
